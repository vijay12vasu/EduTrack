spring:
  application:
    name: user-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/test

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-very-long-secret-key-for-local-development-only-123456}
    access-token-expiration-ms: 86400000