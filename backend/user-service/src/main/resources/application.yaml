spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/edutrack
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  jwt:
    secret: edutrack-dev-secret-key-change-me-before-prod-32bytes