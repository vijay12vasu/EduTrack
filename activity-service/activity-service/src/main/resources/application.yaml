spring:
  application:
    name: activity-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/edutrack_activities

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # MUST be the exact same secret configured in user-service, since this
    # service only verifies signatures issued there — it never issues tokens.
    # Override via env var in real deployments: JWT_SECRET must be a
    # Base64 or plain string of at least 32 bytes for HS256.
    secret: ${JWT_SECRET:edutrack-dev-secret-key-change-me-before-prod-32bytes}
