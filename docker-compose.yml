version: "3.8"

# OPTIONAL infrastructure — NOT required to run EduTrack locally.
#
# Local dev default: services connect directly to an existing local MongoDB
# install at localhost:27017 (no Docker needed, no auth configured — see each
# service's application.yaml).
#
# This file exists for teammates who don't have MongoDB installed, or for a
# shared/CI environment where a disposable, reproducible Mongo instance is
# preferred over a native install. If you already have local MongoDB running
# on port 27017, you do not need to run this file — and you shouldn't run it
# at the same time as a native install, since both would claim port 27017.
#
# To use it instead of a local install:
#   docker compose up -d
# Each microservice connects to its own logical database on this instance
# (edutrack_users, edutrack_activities, edutrack_verifications) — Mongo
# creates a database automatically on first write, no manual step needed.
# Note this container requires auth (edutrack/edutrack_dev_password), unlike
# the no-auth local-install default, so application.yaml would need those
# credentials added if you switch to this path.

services:
  mongodb:
    image: mongo:7
    container_name: edutrack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: edutrack
      MONGO_INITDB_ROOT_PASSWORD: edutrack_dev_password
    volumes:
      - edutrack-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: lightweight web UI for browsing collections during development.
  # Remove this service if you don't want it running.
  mongo-express:
    image: mongo-express:1
    container_name: edutrack-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8090:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: edutrack
      ME_CONFIG_MONGODB_ADMINPASSWORD: edutrack_dev_password
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"

volumes:
  edutrack-mongo-data: